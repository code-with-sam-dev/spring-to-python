[project]
name = "fastapi-payments"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "pydantic==2.13.5",
    "httpx==0.28.1",
    "sqlalchemy==2.1.4",
    "psycopg[binary]==3.3.6",
]

[dependency-groups]
dev = ["pytest==9.1.1", "mypy"]

[tool.pytest.ini_options]
pythonpath = ["."]
